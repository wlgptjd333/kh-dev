<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영역관련태그</title>
    <style>
        #abc {
            width: 100px;
            height: 100px;
            background-color: rgba(42, 160, 52, 0.945);
            border: 3px solid rgba(132, 16, 136, 0.945);
            border-radius: 20px;
        }
        #abc:hover {
            background-color: rgba(42, 160, 52, 0.5);
            border: 3px solid rgba(132, 16, 136, 0.5);
            cursor: pointer;
            color: aquamarine
        }
    </style>
</head>
<body>
    <h1>영역관련태그</h1>

    <hr>
    <br>

    <div id="abc" class="box">얍</div>

</body>
</html>
