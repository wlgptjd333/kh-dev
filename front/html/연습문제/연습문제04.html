<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문하기</title>
  </head>
  <body>
    <h2>주문하기</h2>

    <form action="네이버" method="get">
      <label>고객명 : <input type="text" name="user" /></label>
      <br /><br />
      <label>전화번호 : <input type="tel" name="phone" /></label>
      <br /><br />
      <label>E-mail : <input type="email" name="email" /></label>
      <br /><br />

      <hr />

      <h3>피자사이즈</h3>
      <label><input type="radio" name="size" value="small" /> Small</label>
      <br /><br />
      <label><input type="radio" name="size" value="medium" /> Medium</label>
      <br /><br />
      <label><input type="radio" name="size" value="large" /> Large</label>
      <br /><br />

      <hr />

      <h3>토핑 선택</h3>
      <label
        ><input type="checkbox" name="topping" value="bacon" /> 베이컨</label
      >
      <br /><br />
      <label
        ><input type="checkbox" name="topping" value="cheese" /> 치즈</label
      >
      <br /><br />
      <label><input type="checkbox" name="topping" value="onion" /> 양파</label>
      <br /><br />
      <label
        ><input type="checkbox" name="topping" value="mushroom" /> 버섯</label
      >
      <br /><br />

      <label>희망 배송 시간 : <input type="time" name="dTime" /></label>
      <br /><br />

      <label>배송 시 요청사항 : </label>
      <textarea name="request" cols="20" rows="4"></textarea>
      <br /><br />

      <input type="submit" value="주문하기" />
    </form>
  </body>
</html>
