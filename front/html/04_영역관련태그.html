<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영역관련태그</title>
    <style>
      #abc {
        width: 100px;
        height: 100px;
        background-color: rgba(42, 160, 52, 0.945);
        border: 3px solid rgba(132, 16, 136, 0.945);
        border-radius: 20px;
      }
      #abc:hover {
        background-color: rgba(42, 160, 52, 0.5);
        border: 3px solid rgba(132, 16, 136, 0.5);
        cursor: pointer;
        color: aquamarine;
      }
    </style>
  </head>
  <body>
    <h1>영역관련태그</h1>
    <!-- 
    블럭요소
        - 한 줄 단위로 영역을 차지하는 요소 (너비가 100%)
        - 새로운 블럭 요소는 새로운 라인에 영역이 잡힌다. (두 블럭요소 간에는 겹치는 일이 없다.)
        - p, pre, div, ...
    인라인 요소
        - 내용에 해당하는 부분만 영역을 차지하는 요소
        - 줄 바꿈이 적용되지 않아 옆으로 영역이 잡힌다. (다음 줄로 넘기고자 한다면 직접 <br>을 넣어줘야 한다.)
        - span, ...
    <div> : 블록 요소의 태그로 레이아웃 분할을 위해 사용한다.
            줄바꿈이 적용되어 이미 존재하는 태그의 다음 줄에 영역이 설정된다. (콘텐츠가 없으면 높이 : 0, 넓이 : 100% )
    <p>   : 블록 요소의 태그로 문단 영역을 지정하는 용도로 사용한다.
            줄바꿈이 적용되어 이미 존재하는 태그의 다음 줄에 영역이 설정된다.
    <span> : 인라인 요소의 태그로 콘텐츠를 감싸는 역할을 하는 태그이다.
            줄바꿈이 적용되지 않아 옆으로 영역이 붙는다. (콘텐츠가 없으면 높이 : none, 넓이 : none)
  -->

    <div>블록요소</div>
    <div>블록요소</div>

    <hr />

    <span>인라인요소</span>
    <span>인라인요소</span>

    <hr />

    <p>문단영역</p>
    <p>문단영역</p>

    <hr />

    <div id="abc">영역태그</div>

    <hr />

    <!-- 웹문서 안에 다른 웹문서 추가 -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/RzRwCzfnKyw?si=afWUb1TukKYysMzH&amp;start=1"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <br />
    <a href="https://www.naver.com">네이버</a>
  </body>
</html>
