<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼 관련 태그</title>
  </head>
  <body>
    <h1>폼 관련 태그</h1>
    <!--  
      <form> 태그
          form 태그는 html에서 사용자가 입력할 수 있는 양식을 제공하는 태그이다.
          form 태그 내의 <input> 태그들을 통해서 사용자가 입력한 정보를 서버로 넘기면서 요청하는 역할을 한다.

      * 속성
          action : 폼 내에 입력된 값들을 전달할 서버에 대한 내용을 기입한다.
          method : get / post 방식으로 전송 방식을 지정한다.
              get : 서버에 사용자가 입력한 값들을 URL에 노출시켜서 전달하는 방식
              post : 서버에 사용자가 입력한 값들을 URL에 노출시키지 않고 전달하는 방식
          autocomplete : 이전 입력 내용을 출력하는 기능(default : on, 각 태그별로 지정 가능)
    -->

    <form action="네이버" method="get">
      <label for="user_id">아이디 : </label>
      <input
        id="user_id"
        type="text"
        name="user_id"
        value="user01"
        placeholder="4~12글자 사이로 입력"
      />
      <br />
      <label for="password">비밀번호 : </label>
      <input
        type="password"
        name="password"
        placeholder="8~16글자 사이로 입력"
      />
      <br />
      <label for="nickname">닉네임 : </label>
      <input
        type="text"
        name="nickname"
        placeholder="닉네임을 입력하세요"
        required
      />
      <br />
      <input type="time" name="date" />날짜
      <br />
      <label for="target01">남자</label>
      <input id="target01" type="radio" name="gender" value="남자" />

      <label for="target02">여자</label>
      <input id="target02" type="radio" name="gender" value="여자" />
      <br />
      <input type="range" name="age" min="1" max="100" />나이
      <br />
      <input type="search" name="search" placeholder="검색어를 입력하세요" />
      <br />
      <input type="email" name="email" placeholder="이메일을 입력하세요" />
      <br />
      <input type="number" name="number" placeholder="숫자를 입력하세요" />
      <br />
      <input type="tel" name="tel" placeholder="전화번호를 입력하세요" />
      <br />
      <br />
      <label>코딩</label>
      <input type="checkbox" name="hobby" value="코딩" />
      <label>운동</label>
      <input type="checkbox" name="hobby" value="운동" />
      <br />
      <input type="color" name="color" />
      <br />
      <input type="file" name="file" multiple accept=".jpg,.png" />
      <br />
      <input type="hidden" name="hidden" value="숨겨진 값" />
      <br />
      <select name="national">
        <optgroup label="국가 선택">
          <option value="kr" selected>대한민국</option>
          <option value="jp">일본</option>
          <option value="us">미국</option>
        </optgroup>
        <optgroup label="도시 선택">
          <option value="seoul">서울</option>
          <option value="tokyo">도쿄</option>
          <option value="newyork">뉴욕</option>
        </optgroup>
      </select>
      <br />
      <progress></progress>
      <br />
      <meter min="0" max="100" value="80" low="30" high="70">70</meter>
      <br />

      <label for="memo">메모</label>
      <textarea
        id="memo"
        name="memo"
        cols="30"
        rows="10"
        placeholder="메모를 입력하세요"
      >
memo</textarea
      >
      <br />
      <button type="button">버튼타입</button>
      <input type="button" value="버튼" />
      <br />
      <input type="submit" value="로그인" />
      <input type="reset" value="처음으로~~~" />
    </form>
  </body>
</html>
