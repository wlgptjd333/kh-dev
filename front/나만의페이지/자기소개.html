<!doctype html>
<html lang="ko">
  <head>

    <title>자기소개: 지혜성</title>
    <link href="./자기소개.css" rel="stylesheet" />

      <a href="#schedule">하루 일정</a>

      <iframe
        class="music-player"
        src="https://www.youtube.com/embed/eczV_lwF8TQ?autoplay=1&controls=1"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen

    <main>
      <div id="intro">
        <h2>나의 정보</h2>
        <div>
          <p><strong>이름: 지혜성</strong></p>
          <p><strong>MBTI: INTP</strong></p>
          <p><strong>나이: 25살</strong></p>
          <h2>
            <strong class="food">
              좋아하는 음식: 오미라에서 나오는 음식 <=

          />

      <div id="schedule">
        <h2>하루 일정표</h2>
        <table border="1">
          <thead>
            <tr>
              <th>시간</th>
              <th>내용</th>

          <tbody>
            <tr>
              <td>06:20</td>
              <td>기상</td>
            </tr>
            <tr>
              <td>09:10</td>
              <td>KH 수업</td>

            <tr>

    <footer id="bottom">
      <p>KH 2026 지혜성</p>
