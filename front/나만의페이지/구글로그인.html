  <!doctype html>
  <html lang="ko">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>로그인 - Google 계정</title>
      <link rel="stylesheet" href="./구글로그인.css" />
    </head>
    <body>
      <!-- 구글 로그인 전체 카드 -->
      <div class="login-card">
        <!-- 왼쪽 영역: 로고, 제목, 안내문구 -->
        <div class="left-section">
          <!-- 구글 G 로고 (SVG) -->
          <svg class="google-logo" viewBox="0 0 24 24" width="40" height="40">
            <path
              fill="#4285F4"
              d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"
            />
            <path
              fill="#34A853"
              d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"
            />
            <path
              fill="#FBBC05"
              d="M5.28 14.27A7.18 7.18 0 0 1 4.9 12c0-.79.14-1.57.38-2.27V6.58H1.25A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.25 5.42l4.03-3.15z"
            />
            <path
              fill="#EA4335"
              d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"
            />
          </svg>

          <h1 class="title">로그인</h1>
          <p class="subtitle">Google 계정 사용</p>
        </div>

        <!-- 오른쪽 영역: 입력폼, 안내글, 버튼들 -->
        <div class="right-section">
          <form action="" method="post">
            <!-- 이메일 입력창 -->
            <div class="input-box">
              <input
                type="text"
                name="user"
                placeholder="이메일 또는 휴대전화"
                required
              />
            </div>

            <!-- 이메일 찾기 링크 -->
            <div class="forgot-box">
              <a href="#" class="blue-link">이메일을 잊으셨나요?</a>
            </div>

            <!-- 게스트 모드 안내문 -->
            <p class="guest-info">
              내 컴퓨터가 아닌가요? 게스트 모드를 사용하여 비공개로
              로그인하세요.
              <a href="#" class="blue-link"
                >게스트 모드 사용 방법 자세히 알아보기</a
              >
            </p>

            <!-- 하단 버튼들 -->
            <div class="button-group">
              <button type="button" class="btn-text">계정 만들기</button>
              <button type="submit" class="btn-primary">다음</button>
            </div>
          </form>
        </div>
      </div>
    </body>
  </html>
</html>
