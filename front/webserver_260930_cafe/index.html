<!doctype html>
<html lang="ko">

  <body>
    <header>
      <h3>혜성카페</h3>

    <div class="banner">
      <h2>우주인의 선택</h2>
      <p>10년 연속 외계인 방문율 1위 카페</p>
      <a href="menu.html">메뉴 보기</a>
    </div>

    <main>
      <h2>추천 메뉴</h2>
      <div class="flex">
        <div class="card">
          <img src="images/comet_americano.jpg" alt="아메리카노" />
          <h3>혜성 아메리카노</h3>
          <p>진한 아메리카노</p>
          <strong>4,000원</strong>
        </div>
        <div class="card">
          <img src="images/blackhole_latte.jpg" alt="블랙홀 라떼" />
          <h3>블랙홀 라떼</h3>
          <p>고소한 흑임자 라떼</p>
          <strong>6,000원</strong>
        </div>
        <div class="card">
          <img src="images/galaxy_lemonade.jpg" alt="갤럭시 에이드" />
          <h3>갤럭시 에이드</h3>
          <p>상큼한 레몬 에이드</p>
          <strong>7,000원</strong>
        </div>
        <div class="card">
          <img src="images/moon_crater_cake.jpg" alt="달 케이크" />
          <h3>달 케이크</h3>
          <p>진한 초코 케이크</p>
          <strong>8,000원</strong>
        </div>
      </div>

      <h2>카페 소개</h2>
      <div class="flex">
        <img src="images/cafe_interior.jpg" alt="매장 사진" />
        <div>
          <p>우주인의 선택 혜성카페</p>
          <p>24시간 영업</p>
          <table>
            <tr>
              <th>매장 수</th>
              <th>메뉴 수</th>
              <th>좌석 수</th>
            </tr>
            <tr>
              <td>2개</td>
              <td>6개</td>
              <td>999석</td>
            </tr>
          </table>
        </div>
      </div>
